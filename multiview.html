<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AI 并排对比</title>
  <link rel="stylesheet" href="multiview.css">
</head>
<body>
  <header id="toolbar">
    <strong class="brand">AI 并排</strong>
    <select id="addSite" title="加一栏"><option value="">＋ 加一栏…</option></select>
    <span class="sep"></span>
    <label title="头脑风暴、竞赛：各栏缩成头像，点头像弹出网站">场景
      <select id="scene">
        <option value="none">普通并排</option>
        <option value="brainstorm">头脑风暴</option>
        <option value="contest">竞赛</option>
      </select>
    </label>
    <label class="no-scene">排法
      <select id="layout">
        <option value="columns">一排（可拖宽）</option>
        <option value="grid">两行网格</option>
        <option value="scroll">横向滚动</option>
      </select>
    </label>
    <label>模式
      <select id="mode">
        <option value="iframe">嵌在本页</option>
        <option value="window">多窗口平铺</option>
      </select>
    </label>
    <label>主题
      <select id="theme" title="页面和各栏的颜色。各栏会按网站实际底色自动反色，栏头 ◐ 可单独改">
        <option value="system">跟随系统</option>
        <option value="light">亮色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <label title="不勾：先把字填进所有栏，再同时点发送（快）。勾上：一栏填完立刻发，再下一栏（老办法，最稳）"><input type="checkbox" id="serial"> 依次发送</label>
    <label title="没点过的栏先不加载，省内存"><input type="checkbox" id="lazy"> 按需加载</label>
    <label title="给支持的站切到深度思考 / 推理模型；不支持的站会提示手动选"><input type="checkbox" id="think"> 深度思考</label>
    <span class="sep"></span>
    <button id="tile" class="win-only">平铺成窗口</button>
    <button id="closeWins" class="win-only">关掉这些窗口</button>
    <button id="diagnose" title="逐栏检查找不找得到输入框和发送按钮">诊断</button>
    <button id="reset" title="恢复默认的 8 个站">恢复默认</button>
  </header>

  <section id="board">
    <div id="avatars"></div>
    <div class="board-ctl">
      <label><span id="mainLabel">主 AI</span> <select id="judge"></select></label>
      <label title="一轮里某个 AI 超过这么久还没答完，就不再等它：有字就用已有的字，没字就跳过">超时 <input id="timeoutMin" type="number" min="1" max="60" step="1" value="5"> 分钟</label>
      <button id="skipWait" title="有的栏一直不算答完时，用各栏现有的回答进入下一步">不等了，继续</button>
      <button id="stopScene">停止</button>
      <span id="sceneHint"></span>
    </div>
    <div id="rounds"></div>
  </section>
  <main id="panes"></main>
  <div id="backdrop"></div>

  <footer id="composer">
    <textarea id="prompt" rows="2" placeholder="输入一次，发给所有勾选的栏。Ctrl/⌘ + Enter 发送；输入 /clear 让勾选的栏都开新对话"></textarea>
    <div class="actions">
      <button id="sendAll" class="primary">发送到全部</button>
      <button id="fillAll">只填不发</button>
    </div>
    <div id="log"></div>
  </footer>

  <div id="dragShield"></div>
  <script src="sites.js"></script>
  <script src="multiview.js"></script>
  <script src="scene.js"></script>
</body>
</html>
